readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "datasets>=3.2.0",
    "faiss-cpu>=1.9.0.post1",
    "fastai>=2.7.18",
    "self-supervised>=1.0.4",
    "timm>=1.0.12",
]
